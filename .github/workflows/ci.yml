name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage" --results-directory ${{ runner.temp }}/TestResults

      - name: Pack (verification only)
        run: dotnet pack src/DistSharp.Cli --no-build --configuration Release --output ${{ runner.temp }}/nupkgs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: distsharp-nupkg
          path: ${{ runner.temp }}/nupkgs/*.nupkg
