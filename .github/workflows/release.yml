name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v',''
          } elseif ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            throw 'No version supplied (expected tag v* or workflow_dispatch input)'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/DistSharp.Cli --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} --output ${{ runner.temp }}/nupkgs

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if (-not $env:NUGET_API_KEY) {
            throw 'NUGET_API_KEY secret is not set. Add it under repo Settings > Secrets and variables > Actions.'
          }
          $pkg = Get-ChildItem "${{ runner.temp }}/nupkgs/*.nupkg" | Select-Object -First 1
          if (-not $pkg) { throw 'No .nupkg produced by pack step.' }
          Write-Host "Pushing $($pkg.Name) to nuget.org"
          dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload nupkg as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: distsharp-${{ steps.version.outputs.version }}-nupkg
          path: ${{ runner.temp }}/nupkgs/*.nupkg
